<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galleria Fotografica</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1A1A1A;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', System, sans-serif;
        }

        /* HEADER */
        .header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(196, 167, 124, 0.2);
        }

        .gallery-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #C4A77C;
            letter-spacing: 2px;
            font-family: 'Playfair Display', serif;
        }

        .close-btn {
            background: none;
            border: none;
            color: #C4A77C;
            font-size: 2.5rem;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .close-btn:hover {
            transform: scale(1.1);
            color: #fff;
        }

        /* MASONRY GRID */
        .collage-grid {
            padding: 20px;
            column-count: 1;
            column-gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 640px) { .collage-grid { column-count: 2; } }
        @media (min-width: 1024px) { .collage-grid { column-count: 3; } }
        @media (min-width: 1280px) { .collage-grid { column-count: 4; } }

        .collage-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            cursor: zoom-in;
            border-radius: 8px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s ease forwards;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            background-color: #2a2a2a; /* Placeholder color while loading */
        }

        .collage-item img {
            width: 100%;
            display: block;
            transition: transform 0.3s ease;
        }

        @media (hover: hover) {
            .collage-item:hover img {
                transform: scale(1.05);
            }
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FULLSCREEN VIEWER (FLIP Transition) */
        .fullscreen-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0);
            z-index: 1000;
            pointer-events: none;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        .fullscreen-viewer.active {
            background: rgba(0, 0, 0, 0.95);
            pointer-events: all;
        }

        .fs-close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 1010;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .fs-zoom-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1010;
            pointer-events: none;
        }

        .fullscreen-viewer.active .fs-close-btn,
        .fullscreen-viewer.active .fs-zoom-info {
            opacity: 1;
        }

        /* Container fisso a tutto schermo */
        .fs-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        /* The image itself, animates purely with transform */
        .fs-image {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            will-change: transform;
            cursor: zoom-in;
            object-fit: cover;
            pointer-events: auto;
        }
        
        .loading-spinner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(196, 167, 124, 0.2);
            border-top: 4px solid #C4A77C;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-msg {
            text-align: center;
            padding: 50px;
            color: #ff6b6b;
            font-size: 1.2rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="gallery-title" id="galleryTitle">GALLERIA</h1>
        <button class="close-btn" id="closeBtn" onclick="window.close()">&times;</button>
    </header>

    <div class="collage-grid" id="collageGrid">
        <!-- Collage items inserted via JS -->
    </div>

    <!-- FULLSCREEN VIEWER -->
    <div class="fullscreen-viewer" id="fsViewer">
        <button class="fs-close-btn" id="fsCloseBtn">&larr;</button>
        <div class="loading-spinner" id="fsSpinner"></div>
        
        <div class="fs-image-container" id="fsImageContainer">
            <img alt="Fullscreen Image" class="fs-image" id="fsImage" style="display: none;">
        </div>
        
        <div class="fs-zoom-info">Scorri per zoomare, trascina per spostarti</div>
    </div>

    <script>
        let galleryConfig = null;
        let currentCategory = '';
        let categoryImages = [];

        // DOM Elements
        const grid = document.getElementById('collageGrid');
        const fsViewer = document.getElementById('fsViewer');
        const fsImage = document.getElementById('fsImage');
        const fsImageContainer = document.getElementById('fsImageContainer');
        const fsCloseBtn = document.getElementById('fsCloseBtn');
        const fsSpinner = document.getElementById('fsSpinner');

        // State
        let isFullscreen = false;
        let activeThumbnailDiv = null;
        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let currentScale = 1; // Used to track the scale assigned during fullscreen mode
        let finalLeft = 0;
        let finalTop = 0;

        function getQueryParam(param) {
            const params = new URLSearchParams(window.location.search);
            return params.get(param);
        }

        function getDriveFullUrl(fileId) {
            return `https://lh3.googleusercontent.com/d/${fileId}`;
        }

        async function init() {
            try {
                // Genera cache buster per assicurarci di avere il JSON aggiornato
                const cacheBuster = new Date().getTime();
                const response = await fetch(`gallery-config.json?t=${cacheBuster}`);
                galleryConfig = await response.json();
                
                currentCategory = getQueryParam('category');
                
                if (!currentCategory || !galleryConfig[currentCategory]) {
                    grid.innerHTML = `<div class="error-msg">Categoria non trovata.</div>`;
                    return;
                }

                document.getElementById('galleryTitle').textContent = currentCategory.toUpperCase();
                categoryImages = galleryConfig[currentCategory];
                
                renderCollage();
            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="error-msg">Errore nel caricamento della galleria.</div>`;
            }
        }

        function renderCollage() {
            grid.innerHTML = '';
            
            categoryImages.forEach((imgData, index) => {
                const div = document.createElement('div');
                div.className = 'collage-item';
                div.style.animationDelay = `${index * 0.05}s`;
                
                const img = document.createElement('img');
                // Use WebP thumbnail if available, otherwise fallback to full Drive link
                img.src = imgData.thumbnail ? imgData.thumbnail : getDriveFullUrl(imgData.fileId);
                img.loading = 'lazy';
                img.alt = imgData.name;
                
                div.appendChild(img);
                grid.appendChild(div);

                div.addEventListener('click', () => openFullscreen(div, imgData));
            });
        }

        // --- FLIP ANIMATION & FULLSCREEN LOGIC ---

        function openFullscreen(thumbnailDiv, imgData) {
            if (isFullscreen) return;
            isFullscreen = true;
            activeThumbnailDiv = thumbnailDiv;
            const thumbImg = thumbnailDiv.querySelector('img');
            const rect = thumbImg.getBoundingClientRect();

            // Reset zoom state
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            fsImage.style.cursor = 'zoom-in';

            // Make image visible and set source
            fsImage.style.display = 'block';
            fsImage.src = thumbImg.src;

            // FIRST: Position fsImage exactly over the thumbnail
            fsImage.style.transition = 'none';
            fsImage.style.width = `${rect.width}px`;
            fsImage.style.height = `${rect.height}px`;
            fsImage.style.transform = `translate(${rect.left}px, ${rect.top}px) scale(1)`;
            fsImage.style.borderRadius = '8px';
            fsImage.style.objectFit = 'cover'; // match thumbnail strictly

            fsViewer.classList.add('active');
            thumbImg.style.opacity = '0'; // Hide original

            document.body.style.overflow = 'hidden'; // Evita scroll del background
            history.pushState({ fullscreen: true }, "");

            // Force reflow
            fsImage.offsetHeight;

            // LAST: Calculate the scale to fit the screen
            const targetWidth = window.innerWidth * 0.9;
            const targetHeight = window.innerHeight * 0.9;
            
            const scaleX = targetWidth / rect.width;
            const scaleY = targetHeight / rect.height;
            const scale = Math.min(scaleX, scaleY);
            currentScale = scale; // Save it for zoom/pan logic
            
            const finalWidth = rect.width * scale;
            const finalHeight = rect.height * scale;
            
            finalLeft = (window.innerWidth - finalWidth) / 2;
            finalTop = (window.innerHeight - finalHeight) / 2;

            // PLAY: Animate transform to the center of the screen
            fsImage.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.4s ease';
            fsImage.style.borderRadius = '0px';
            fsImage.style.transform = `translate(${finalLeft}px, ${finalTop}px) scale(${scale})`;
            
            // Load High Res Image in background
            fsSpinner.style.opacity = '1';
            const highResImg = new Image();
            highResImg.src = getDriveFullUrl(imgData.fileId);
            highResImg.onload = () => {
                if (isFullscreen) {
                    fsImage.src = highResImg.src;
                    fsSpinner.style.opacity = '0';
                    fsImage.style.objectFit = 'contain';
                }
            };
        }

        function closeFullscreen(fromPopState = false) {
            if (!isFullscreen || !activeThumbnailDiv) return;
            isFullscreen = false;
            
            if (fromPopState !== true) {
                history.back();
            }

            document.body.style.overflow = ''; // Ripristina scroll del background

            fsViewer.classList.remove('active');
            fsSpinner.style.opacity = '0';

            const thumbImg = activeThumbnailDiv.querySelector('img');
            const rect = thumbImg.getBoundingClientRect();

            // Return to zoom 1 and remove image transformations
            zoomLevel = 1;
            panX = 0; 
            panY = 0;
            fsImage.style.cursor = 'zoom-in';

            // Calcola la scala esatta per far combaciare l'immagine con il thumbnail corrente
            const oldWidth = parseFloat(fsImage.style.width);
            const targetScaleX = oldWidth > 0 ? (rect.width / oldWidth) : 1;

            fsImage.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.4s ease';
            fsImage.style.borderRadius = '8px';
            fsImage.style.transform = `translate(${rect.left}px, ${rect.top}px) scale(${targetScaleX})`;

            // Restore original thumbnail after animation
            setTimeout(() => {
                if (!isFullscreen && activeThumbnailDiv) {
                    thumbImg.style.opacity = '1';
                    fsImage.style.transition = 'none';
                    fsImage.style.display = 'none';
                    activeThumbnailDiv = null;
                }
            }, 400);
        }

        window.addEventListener('popstate', (e) => {
            if (isFullscreen) {
                closeFullscreen(true);
            }
        });

        fsCloseBtn.addEventListener('click', closeFullscreen);

        fsViewer.addEventListener('click', (e) => {
            if (e.target === fsViewer || e.target === fsImageContainer) {
                closeFullscreen();
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeFullscreen();
        });

        // --- ZOOM & PAN LOGIC ---
        
        function updateImageTransform(smooth = false) {
            if (!isFullscreen) return;
            const totalScale = currentScale * zoomLevel;
            const posX = finalLeft + panX;
            const posY = finalTop + panY;
            
            fsImage.style.transition = smooth ? 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
            fsImage.style.transform = `translate(${posX}px, ${posY}px) scale(${totalScale})`;
            
            if (zoomLevel > 1) {
                fsImage.style.cursor = isDragging ? 'grabbing' : 'grab';
            } else {
                fsImage.style.cursor = 'zoom-in';
            }
        }
        
        function performZoom(newZoom, clientX, clientY, smooth = true) {
            if (newZoom < 1) newZoom = 1;
            if (newZoom > 6) newZoom = 6;
            
            if (newZoom === 1) {
                panX = 0;
                panY = 0;
                zoomLevel = 1;
            } else {
                const oldZoom = zoomLevel;
                const scaleRatio = newZoom / oldZoom;
                panX = (clientX - finalLeft) * (1 - scaleRatio) + panX * scaleRatio;
                panY = (clientY - finalTop) * (1 - scaleRatio) + panY * scaleRatio;
                zoomLevel = newZoom;
            }
            updateImageTransform(smooth);
        }

        // Mouse Wheel Zoom
        fsViewer.addEventListener('wheel', (e) => {
            if (!isFullscreen) return;
            e.preventDefault();
            
            const zoomSensitivity = 0.2;
            const delta = e.deltaY < 0 ? 1 : -1;
            
            performZoom(zoomLevel + delta * zoomSensitivity, e.clientX, e.clientY, false);
        }, { passive: false });

        // Mouse Drag & Click to Zoom
        let startX = 0, startY = 0;
        let dragMoved = false;

        fsImage.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isDragging = true;
            dragMoved = false;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            if (zoomLevel > 1) {
                updateImageTransform(false); // Update cursor to grabbing
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            if (zoomLevel <= 1) return; // Don't pan if not zoomed in
            
            const dx = e.clientX - startX - panX;
            const dy = e.clientY - startY - panY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                dragMoved = true;
            }
            
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            
            updateImageTransform(false);
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                if (zoomLevel > 1) {
                    updateImageTransform(false); // Update cursor back to grab
                }
            }
        });

        // Click to zoom in/out
        fsImage.addEventListener('click', (e) => {
            if (dragMoved) return; // It was a drag, not a click
            
            if (zoomLevel === 1) {
                performZoom(2.5, e.clientX, e.clientY, true);
            } else {
                performZoom(1, e.clientX, e.clientY, true);
            }
        });
        
        // Touch events for mobile zooming/panning
        let initialPinchDistance = null;
        let initialZoom = 1;
        let initialPanX = 0;
        let initialPanY = 0;
        let initialCenterX = 0;
        let initialCenterY = 0;
        let touchDragMoved = false;
        let lastTapTime = 0;
        
        fsImage.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // Pinch start
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = zoomLevel;
                initialPanX = panX;
                initialPanY = panY;
                initialCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                initialCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                isDragging = false;
            } else if (e.touches.length === 1) {
                // Pan start
                isDragging = true;
                touchDragMoved = false;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });
        
        fsImage.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance) {
                // Pinch zooming and panning
                e.preventDefault();
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = currentDistance / initialPinchDistance;
                const targetZoom = initialZoom * zoomFactor;
                
                const currentCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const currentCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                let tempZoom = targetZoom;
                if (tempZoom < 1) tempZoom = 1;
                if (tempZoom > 6) tempZoom = 6;
                
                const scaleRatio = tempZoom / initialZoom;
                panX = (initialCenterX - finalLeft) * (1 - scaleRatio) + initialPanX * scaleRatio;
                panY = (initialCenterY - finalTop) * (1 - scaleRatio) + initialPanY * scaleRatio;
                
                // Add the drag part of the pinch
                panX += (currentCenterX - initialCenterX);
                panY += (currentCenterY - initialCenterY);
                
                if (tempZoom === 1) {
                    panX = 0;
                    panY = 0;
                }
                
                zoomLevel = tempZoom;
                updateImageTransform(false);
            } else if (e.touches.length === 1 && isDragging && zoomLevel > 1) {
                // Panning
                e.preventDefault();
                const dx = e.touches[0].clientX - startX - panX;
                const dy = e.touches[0].clientY - startY - panY;
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    touchDragMoved = true;
                }
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateImageTransform(false);
            }
        }, { passive: false });
        
        fsImage.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if (e.touches.length === 0) {
                isDragging = false;
                
                // Detect Double Tap for zoom in/out
                if (!touchDragMoved && zoomLevel >= 1) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTapTime;
                    if (tapLength < 300 && tapLength > 0) {
                        // Double tap
                        if (zoomLevel === 1) {
                            performZoom(2.5, e.changedTouches[0].clientX, e.changedTouches[0].clientY, true);
                        } else {
                            performZoom(1, e.changedTouches[0].clientX, e.changedTouches[0].clientY, true);
                        }
                        lastTapTime = 0;
                    } else {
                        lastTapTime = currentTime;
                    }
                }
            } else if (e.touches.length === 1 && zoomLevel > 1) {
                isDragging = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        });

        // Initialize
        init();
    </script>
</body>
</html>
